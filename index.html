<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pomodoro Timer</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta
      name="theme-color"
      content="{{themeColor}}"
      media="(prefers-color-scheme: light)"
    />
    <meta name="color-scheme" content="dark light" />
  </head>

  <body
    class="bg-linear-45 from-gray-700 to-gray-600 text-white data-[interval=long-break]:from-green-700 data-[interval=long-break]:to-green-600 data-[interval=short-break]:from-teal-800 data-[interval=short-break]:to-teal-700 data-[interval=work]:from-amber-800 data-[interval=work]:to-amber-700"
  >
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
